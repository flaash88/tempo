[project]
name = "tempo"
version = "0.1.0"
description = "Self-hosted training analysis for runners"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "AGPL-3.0-or-later" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "apscheduler>=3.10",
    "fitdecode>=0.10",
    "httpx>=0.27",
]

[project.scripts]
tempo = "tempo.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tempo"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "ARG", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Alembic revisions are generated boilerplate with fixed names.
"tempo/db/migrations/versions/*" = ["E501"]
# Pytest fixtures are requested for their side effect (isolated data
# directory, migrated database) and then legitimately go unused.
"tests/*" = ["ARG001"]
# The subcommand handlers share one signature so the dispatch stays flat;
# not every handler needs every argument.
"tempo/cli.py" = ["ARG001"]

[tool.mypy]
python_version = "3.12"
files = ["tempo", "tests"]
plugins = []
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_return_any = true

# The metric engine is the deterministic core — it is held to strict typing.
[[tool.mypy.overrides]]
module = "tempo.metrics.*"
strict = true

[[tool.mypy.overrides]]
module = "tempo.db.migrations.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:tempo.*"]
